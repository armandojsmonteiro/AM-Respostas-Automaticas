name: Build AM Respostas Automáticas APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: List repository files
        run: |
          echo "Conteúdo do repositório:"
          find . -maxdepth 3 -type f | sort
