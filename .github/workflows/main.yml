name: Build AM Respostas Automaticas APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Preparar projeto Android
        shell: bash
        run: |
          set -e

          ZIP_FILE=$(find . -maxdepth 1 -type f -iname 'AM_Responder*.zip' | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERRO: Não foi encontrado o ZIP da AM Respostas Automáticas."
            exit 1
          fi

          echo "ZIP encontrado: $ZIP_FILE"

          rm -rf project
          mkdir -p project
          unzip -o "$ZIP_FILE" -d project

          echo "Conteúdo do projeto:"
          find project -maxdepth 5 -type f | sort

          PROJECT_DIR=$(find project -name "settings.gradle.kts" -type f -print -quit | xargs dirname)

          if [ -z "$PROJECT_DIR" ] || [ ! -f "$PROJECT_DIR/settings.gradle.kts" ]; then
            echo "ERRO: Não foi encontrado um projeto Gradle válido dentro do ZIP."
            exit 1
          fi

          echo "Projeto Android encontrado em: $PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Construir APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "A construir o AM Respostas Automaticas..."
          gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Renomear APK
        shell: bash
        run: |
          set -e

          cp "$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk" "AM Respostas Automaticas.apk"

      - name: Enviar APK
        uses: actions/upload-artifact@v4
        with:
          name: AM Respostas Automaticas
          path: "AM Respostas Automaticas.apk"
          if-no-files-found: error
