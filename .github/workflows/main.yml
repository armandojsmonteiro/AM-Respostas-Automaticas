name: Build AM Respostas Automaticas APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Preparar projeto
        run: |
          mkdir -p project
          ZIP_FILE=$(find . -maxdepth 1 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERRO: Não foi encontrado nenhum ficheiro ZIP."
            exit 1
          fi

          echo "A descompactar: $ZIP_FILE"
          unzip -o "$ZIP_FILE" -d project

      - name: Encontrar projeto Android
        run: |
          GRADLEW=$(find project -type f -name "gradlew" | head -n 1)

          if [ -z "$GRADLEW" ]; then
            echo "ERRO: Não foi encontrado o gradlew dentro do ZIP."
            echo "Conteúdo encontrado:"
            find project -maxdepth 4 -type f | head -100
            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLEW")

          echo "Projeto Android encontrado em:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Dar permissões ao Gradle
        run: chmod +x "$PROJECT_DIR/gradlew"

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AM-Respostas-Automaticas-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
